<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parseller">
<title>ÇKS Parselleri – Bozova</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg:#ffffff; --fg:#17191c; --muted:#5f6670; --line:#e4e7eb; --soft:#f2f4f6; --hover:#fff4cc;
    --fistik:#e0a526; --arpa:#3fb6e8; --sel:#ff2d55; --accent:#1a73e8;
    --sheet-shadow:0 -6px 28px rgba(0,0,0,.28);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181b; --fg:#eef0f3; --muted:#9aa1ab; --line:#2c3036; --soft:#23262b; --hover:#3a3318; --accent:#6ea8ff; color-scheme: dark; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  button { font:inherit; color:inherit; }

  #map { position:fixed; inset:0; background:#2b2f2a; }

  /* ---------- Alt panel (mobil) / yan panel (masaüstü) ---------- */
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:1000;
    height:88vh; height:88dvh; display:flex; flex-direction:column;
    background:var(--bg); border-radius:18px 18px 0 0; box-shadow:var(--sheet-shadow);
    transform:translateY(70vh); transition:transform .3s cubic-bezier(.2,.8,.2,1); will-change:transform; }
  #sheet.dragging { transition:none; }
  .head { padding:8px 16px 12px; touch-action:none; cursor:grab; user-select:none; }
  .grip { width:42px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 10px; }
  .sum { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .sum h1 { font-size:17px; margin:0; letter-spacing:-.01em; }
  .sum .tot { font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .sum .tot small { font-weight:500; color:var(--muted); }
  .sub { color:var(--muted); font-size:12.5px; margin-top:2px; }
  .chips { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:7px; background:var(--soft); border-radius:999px;
    padding:5px 11px; font-size:13px; font-variant-numeric:tabular-nums; }
  .chip b { font-weight:650; }
  .dot { width:11px; height:11px; border-radius:3px; flex:none; }

  /* Seçili parsel kartı */
  #detail { margin:0 12px 10px; border:1px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--bg); }
  .dhead { display:flex; align-items:center; gap:8px; }
  .dhead b { font-size:16px; }
  .dhead .koy { color:var(--muted); font-size:13px; }
  .dhead .x { margin-left:auto; width:32px; height:32px; border:none; background:var(--soft); border-radius:50%; font-size:18px; line-height:1; cursor:pointer; }
  .dgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
  .dgrid div { background:var(--soft); border-radius:10px; padding:7px 9px; min-width:0; }
  .dgrid span { display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .dgrid b { font-variant-numeric:tabular-nums; font-size:15px; }
  .dmeta { margin-top:8px; font-size:13px; color:var(--muted); }
  .dact { display:flex; gap:8px; margin-top:10px; }
  .dact a, .dact button { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; min-height:42px;
    border-radius:10px; border:1px solid var(--line); background:var(--bg); text-decoration:none; color:var(--fg); font-weight:600; font-size:14px; cursor:pointer; }
  .dact a.primary { background:var(--accent); border-color:var(--accent); color:#fff; }

  .controls { padding:0 16px 10px; display:flex; flex-direction:column; gap:10px; }
  .filters { display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:0 16px; }
  .filters::-webkit-scrollbar { display:none; }
  .filters button { flex:none; min-height:36px; padding:0 14px; border:1px solid var(--line); background:var(--bg);
    border-radius:999px; font-size:14px; cursor:pointer; }
  .filters button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  #search { width:100%; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--soft); color:var(--fg); outline:none; }
  #search:focus { border-color:var(--accent); background:var(--bg); }
  #list { flex:1; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom, 0px); }
  .row { display:flex; align-items:center; gap:10px; min-height:52px; padding:6px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:active, .row.active { background:var(--hover); }
  .row .ap { font-weight:650; font-variant-numeric:tabular-nums; min-width:58px; }
  .row .meta { color:var(--muted); font-size:13px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .da { font-variant-numeric:tabular-nums; font-size:14px; }
  .row .da small { color:var(--muted); }
  .empty { padding:24px 16px; color:var(--muted); text-align:center; }

  /* Harita kontrolleri */
  .leaflet-top { top:env(safe-area-inset-top, 0px); }
  .leaflet-left { left:env(safe-area-inset-left, 0px); }
  .leaflet-right { right:env(safe-area-inset-right, 0px); }
  .mapbtn { width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:#fff; color:#333;
    border:none; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.35); cursor:pointer; margin-top:8px; }
  .mapbtn.on { color:#1a73e8; }
  .mapbtn svg { width:22px; height:22px; }
  .lbl { background:rgba(0,0,0,.66); color:#fff; border:none; box-shadow:none; font-weight:650; font-size:11px; padding:1px 5px; border-radius:4px; }
  .lbl::before { display:none; }
  .leaflet-control-attribution { font-size:9px; }
  #toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 12px); transform:translateX(-50%); z-index:2000;
    background:rgba(20,20,20,.9); color:#fff; padding:9px 14px; border-radius:10px; font-size:14px; max-width:90vw; }

  /* Masaüstü: yan panel */
  @media (min-width:768px) {
    #map { left:360px; }
    #sheet { top:0; right:auto; width:360px; height:auto; border-radius:0; transform:none !important; box-shadow:none; border-right:1px solid var(--line); }
    .head { cursor:default; padding-top:16px; }
    .grip { display:none; }
    .mapbtn { width:36px; height:36px; border-radius:6px; }
  }
  @media (max-width:767px) {
    .leaflet-control-zoom, .leaflet-control-scale { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { #sheet { transition:none; } }
</style>
</head>
<body>
<div id="map"></div>

<section id="sheet" aria-label="Parsel listesi">
  <div class="head" id="head">
    <div class="grip"></div>
    <div class="sum">
      <h1>ÇKS 2027 Parseller</h1>
      <div class="tot"><span id="sArea"></span> <small>da</small></div>
    </div>
    <div class="sub"><span id="sCount"></span> parsel · Bozova / Karakaş &amp; Dokuzağaç</div>
    <div class="chips">
      <span class="chip"><span class="dot" style="background:var(--fistik)"></span>Antep fıstığı <b id="sFistik"></b></span>
      <span class="chip"><span class="dot" style="background:var(--arpa)"></span>Arpa <b id="sArpa"></b></span>
    </div>
  </div>

  <div id="detail" hidden></div>

  <div class="controls">
    <div class="filters" id="filters">
      <button data-f="all" class="on">Tümü</button>
      <button data-f="Antep Fıstığı">Antep fıstığı</button>
      <button data-f="Arpa">Arpa</button>
      <button data-f="KARAKAŞ">Karakaş</button>
      <button data-f="DOKUZAĞAÇ">Dokuzağaç</button>
    </div>
    <input id="search" type="search" inputmode="numeric" placeholder="Ada / parsel ara (ör. 135/4)" autocomplete="off">
  </div>
  <div id="list"></div>
</section>
<div id="toast" hidden></div>

const COL = { 'Antep Fıstığı':'#e0a526', 'Arpa':'#3fb6e8' };
const MULK = { 'KM':'Kendi malı', 'KR':'Kira', 'KM / KR':'Kendi malı + Kira' };
const fmt = n => n.toLocaleString('tr-TR',{minimumFractionDigits:3,maximumFractionDigits:3});
const koyAd = m => m==='KARAKAŞ' ? 'Karakaş' : 'Dokuzağaç';
const feats = PARSELLER.features;
const $ = id => document.getElementById(id);
const sheet=$('sheet'), head=$('head'), detail=$('detail');
const mobile = () => matchMedia('(max-width:767px)').matches;

/* ---------- Harita ---------- */
const map = L.map('map',{ zoomControl:false, attributionControl:false, tap:true });
L.control.zoom({position:'topleft'}).addTo(map);
L.control.attribution({position:'topright', prefix:'<a href="https://leafletjs.com">Leaflet</a>'}).addTo(map);
const uydu = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:19,attribution:'Esri World Imagery'}).addTo(map);
const etiket = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:19}).addTo(map);
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:19,attribution:'© OpenStreetMap'});
L.control.layers({'Uydu':uydu,'Harita':osm},{'Yer adları':etiket},{position:'topright'}).addTo(map);
L.control.scale({imperial:false, position:'bottomleft'}).addTo(map);

function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,3500); }

// Konumum
let meMarker=null, meCircle=null, follow=false;
const loc = L.control({position:'topleft'});
loc.onAdd = () => { const b=L.DomUtil.create('button','mapbtn'); b.title='Konumum'; b.setAttribute('aria-label','Konumum');
  b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>';
  L.DomEvent.disableClickPropagation(b);
  b.onclick=()=>{ follow=true; b.classList.add('on'); toast('Konum alınıyor…'); map.locate({watch:true,enableHighAccuracy:true}); };
  return b; };
loc.addTo(map);
map.on('locationfound',e=>{
  $('toast').hidden=true;
  if(!meMarker){ meCircle=L.circle(e.latlng,{radius:e.accuracy,color:'#1a73e8',weight:1,fillOpacity:.12,interactive:false}).addTo(map);
    meMarker=L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1,interactive:false}).addTo(map); }
  else { meMarker.setLatLng(e.latlng); meCircle.setLatLng(e.latlng).setRadius(e.accuracy); }
  if(follow){ follow=false; map.setView(e.latlng, Math.max(map.getZoom(),17)); }
});
map.on('locationerror',()=>toast('Konum alınamadı. Telefonda konum iznini aç.'));

/* ---------- Parseller ---------- */
const style = f => ({ color:'#fff', weight:2, fillColor:COL[f.properties.urun], fillOpacity:.55 });
const byNo = {};
const layer = L.geoJSON(PARSELLER,{
  style,
  onEachFeature:(f,l)=>{
    const p=f.properties; byNo[p.no]=l;
    l.bindTooltip(`${p.ada}/${p.parsel}`,{permanent:true,direction:'center',className:'lbl',interactive:false});
    l.on('click',ev=>{ L.DomEvent.stop(ev); select(p.no,{fly:false}); });
  }
}).addTo(map);
const labels=()=>{ const z=map.getZoom(); layer.eachLayer(l=>{ if(l._hidden) return l.closeTooltip(); z>=15?l.openTooltip():l.closeTooltip(); }); };
map.on('zoomend',labels);

/* ---------- Alt panel konumları ---------- */
let state='collapsed';
function positions(){
  const H=sheet.offsetHeight, peek=head.offsetHeight+(detail.hidden?0:detail.offsetHeight+10);
  return { collapsed:Math.max(0,H-peek), half:Math.max(0,H-innerHeight*0.55), full:0 };
}
function curY(){ const m=new DOMMatrix(getComputedStyle(sheet).transform); return m.m42; }
function setState(s){ state=s; sheet.style.transform = mobile()?`translateY(${positions()[s]}px)`:''; }
function visibleSheet(){ return mobile() ? sheet.offsetHeight-positions()[state] : 0; }
function padOpts(maxZoom){ return { paddingTopLeft:[24, 24], paddingBottomRight:[24, 24+visibleSheet()], maxZoom }; }

// Sürükleme
let drag=null;
head.addEventListener('pointerdown',e=>{ if(!mobile()) return; drag={y:e.clientY, t:curY(), moved:false}; sheet.classList.add('dragging'); head.setPointerCapture(e.pointerId); });
head.addEventListener('pointermove',e=>{ if(!drag) return; const dy=e.clientY-drag.y; if(Math.abs(dy)>5) drag.moved=true;
  const y=Math.min(Math.max(drag.t+dy,0),positions().collapsed); sheet.style.transform=`translateY(${y}px)`; });
head.addEventListener('pointerup',e=>{ if(!drag) return; sheet.classList.remove('dragging'); const dy=e.clientY-drag.y, order=['collapsed','half','full'];
  let i=order.indexOf(state);
  if(!drag.moved) i = state==='collapsed'?1:0;
  else if(dy<-40) i=Math.min(2,i+1); else if(dy>40) i=Math.max(0,i-1);
  drag=null; setState(order[i]); });
head.addEventListener('pointercancel',()=>{ drag=null; sheet.classList.remove('dragging'); setState(state); });
addEventListener('resize',()=>setState(state));

/* ---------- Seçim ---------- */
let active=null;
function select(no,{fly=true}={}){
  if(active && byNo[active]) layer.resetStyle(byNo[active]);
  active=no; const l=byNo[no], p=l.feature.properties, c=l.getBounds().getCenter();
  l.setStyle({color:'#ff2d55',weight:4,fillOpacity:.7}); l.bringToFront();
  detail.innerHTML=`
    <div class="dhead"><span class="dot" style="background:${COL[p.urun]}"></span><b>Ada ${p.ada} / Parsel ${p.parsel}</b><span class="koy">${koyAd(p.mahalle)}</span>
      <button class="x" id="dclose" aria-label="Kapat">×</button></div>
    <div class="dgrid">
      <div><span>Kullanılan</span><b>${fmt(p.kullanilan)}</b></div>
      <div><span>Tasarruf</span><b>${fmt(p.tasarruf)}</b></div>
      <div><span>Tapu</span><b>${fmt(p.tapu)}</b></div>
    </div>
    <div class="dmeta">${p.urun} · ${MULK[p.mulkiyet]||p.mulkiyet} · ${p.nitelik||'-'} · Pafta ${p.pafta||'-'} · alanlar dekar</div>
    <div class="dact">
      <a class="primary" href="https://www.google.com/maps/dir/?api=1&destination=${c.lat.toFixed(6)},${c.lng.toFixed(6)}" target="_blank" rel="noopener">Yol tarifi</a>
      <button id="dzoom">Parsele git</button>
    </div>`;
  detail.hidden=false;
  $('dclose').onclick=clearSel;
  $('dzoom').onclick=()=>map.flyToBounds(l.getBounds(),{...padOpts(18),duration:.6});
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('active',+r.dataset.no===no));
  setState('collapsed');
  const target=()=>{ if(fly) map.flyToBounds(l.getBounds(),{...padOpts(17),duration:.6});
    else { const pt=map.latLngToContainerPoint(c), h=map.getSize().y-visibleSheet(); if(pt.y>h-30||pt.y<30) map.panBy([0, pt.y-h/2]); } };
  mobile()?setTimeout(target,320):target();
}
function clearSel(){ if(active && byNo[active]) layer.resetStyle(byNo[active]); active=null; detail.hidden=true;
  document.querySelectorAll('.row.active').forEach(r=>r.classList.remove('active')); setState(state); }
map.on('click',()=>{ if(!detail.hidden) clearSel(); });

/* ---------- Liste / filtre ---------- */
let filt='all', q='';
function render(refit){
  const vis=feats.filter(f=>{const p=f.properties;
    const okF = filt==='all'||p.urun===filt||p.mahalle===filt;
    const s=q.replace(/\s/g,'');
    const okQ = !s || `${p.ada}/${p.parsel}`.startsWith(s) || (!s.includes('/') && String(p.ada).startsWith(s));
    return okF&&okQ;});
  const set=new Set(vis.map(f=>f.properties.no));
  layer.eachLayer(l=>{ const on=set.has(l.feature.properties.no); l._hidden=!on;
    if(on){ l.setStyle(l.feature.properties.no===active?{color:'#ff2d55',weight:4,fillOpacity:.7}:style(l.feature)); }
    else l.setStyle({opacity:0,fillOpacity:0}); });
  labels();
  $('list').innerHTML = vis.length ? vis.map(f=>{const p=f.properties;
    return `<div class="row${p.no===active?' active':''}" data-no="${p.no}"><span class="dot" style="background:${COL[p.urun]}"></span>
      <span class="ap">${p.ada}/${p.parsel}</span><span class="meta">${koyAd(p.mahalle)} · ${p.urun}</span>
      <span class="da">${fmt(p.kullanilan)} <small>da</small></span></div>`}).join('') : '<div class="empty">Bu aramaya uyan parsel yok.</div>';
  const sum=k=>vis.filter(f=>!k||f.properties.urun===k).reduce((a,f)=>a+f.properties.kullanilan,0);
  $('sCount').textContent=vis.length; $('sArea').textContent=fmt(sum()); $('sFistik').textContent=fmt(sum('Antep Fıstığı')); $('sArpa').textContent=fmt(sum('Arpa'));
  if(refit && vis.length) map.fitBounds(L.featureGroup(vis.map(f=>byNo[f.properties.no])).getBounds(), padOpts(17));
}
$('list').addEventListener('click',e=>{const r=e.target.closest('.row'); if(r){ $('search').blur(); select(+r.dataset.no); }});
$('filters').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return;
  filt=b.dataset.f; document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on',x===b)); render(true);});
$('search').addEventListener('input',e=>{q=e.target.value.trim(); render(q.length>0);});
$('search').addEventListener('focus',()=>{ if(mobile()) setState('full'); });

/* ---------- Başlangıç ---------- */
render(false);
setState('collapsed');
map.fitBounds(layer.getBounds(), padOpts(17));
labels();
</script>
</body>
</html>
